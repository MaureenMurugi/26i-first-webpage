<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lesson 3</title>

    </head>
    <body>

        <!-- HTML Links -->

        <a href="https://zinduaschool.com/">Zindua School</a>
        <a href="https://www.airbnb.com/" target="_blank" rel="noopener">Airbnb</a>

        <!-- HTML Images -->

        <img src="assets/cadillac.jpg" alt="cadillac" height="100px" width="100px">
        <img src="assets/kites.jpg" alt="kids flying a kites" height="200px" width="200px">
        <img src="https://www.pexels.com/photo/cadillac-eldorado-at-public-show-21628146/" alt="cadillac">

        <!-- HTML Tables -->

        <table>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Score</th>
            </tr>
            <tr>
                <td>Maureen</td>
                <td>CSS</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Naphtali</td>
                <td>HTML</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Alvin</td>
                <td>JS</td>
                <td>96</td>
            </tr>
        </table>


        <!-- More structured table -->
         <table>
            <caption>Student Performance</caption>

            <thead>
                <tr>
                    <th scope="col">Student</th>
                    <th scope="col">Subject</th>
                    <th scope="col">Score</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Jane Doe</td>
                    <td>Python</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>John Doe</td>
                    <td>Django</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>John Smith</td>
                    <td>React</td>
                    <td>70</td>
                </tr>
            </tbody>
         </table>

    </body>
</html>
